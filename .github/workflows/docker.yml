name: docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/firebirdsql-site

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          TAG="sha-${GITHUB_SHA::13}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          docker build -f deploy/Dockerfile -t "$IMAGE:$TAG" -t "$IMAGE:latest" .

      - name: Smoke test (redirects + pages over the whole legacy dump)
        run: |
          docker run -d --name site -p 127.0.0.1:8081:80 "$IMAGE:latest"
          sleep 2
          python3 tools/smoke_redirects.py http://localhost:8081

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$TAG"
