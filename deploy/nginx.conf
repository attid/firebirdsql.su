# nginx.conf контейнера нового сайта firebirdsql.su.
# Собирается целиком из репозитория: статику приносит site/dist,
# карту редиректов генерирует tools/make_redirect_map.py.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;
    gzip_min_length 1024;

    server_tokens off;
    absolute_redirect off;                     # Location: /path/ без схемы/хоста
    resolver 127.0.0.11 valid=30s ipv6=off;  # docker embedded DNS
    resolver_timeout 5s;                       # соседа нет — 502 за 5с, не за 30

    # --- Карта 301 со старых URL DokuWiki (генерируется, не править руками) ---
    # Точные ключи из redirects.map + срезание префикса пространства имён
    # у ссылок из кэша поисковиков (glossarij:abs -> /abs/).
    # Ключи длинные (ID бывают по 70+ символов) — бакет больше дефолтного.
    map_hash_bucket_size 128;
    map $arg_id $fb_new_path {
        default /;
        include /etc/nginx/redirects.map;
        "~^(?:[a-z0-9_.\-]+:)(?<fb_ns_strip>[a-z0-9_.\-]+)$" /$fb_ns_strip/;
    }

    # --- Защита (ADR-0006/0007): лимиты запросов к не-статике ---
    limit_req_zone $binary_remote_addr zone=remark_api:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=ai_api:10m rate=6r/m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    server {
        listen 80;
        server_name firebirdsql.su www.firebirdsql.su _;

        root /usr/share/nginx/html;
        index index.html;

        limit_conn perip 30;

        # --- Точная статика: НЕ должна попадать под path-редирект ниже ---
        location = /robots.txt { }
        location = /favicon.svg { }
        location = /sitemap-index.xml { }
        location ~ ^/sitemap-[0-9]+\.xml$ { }

        # --- Старые URL, форма 1: /doku.php?id=<page_id> ---
        location = /doku.php {
            return 301 $fb_new_path;
        }

        # --- Старые URL, форма 2: /<page_id> без слэша (path-форма вики);
        #     двоеточечный префикс старых пространств имён срезается ---
        location ~ ^/(?:[a-z0-9_.\-]+:)?(?<fb_path_id>[a-z0-9_.\-]+)$ {
            return 301 /$fb_path_id/;
        }

        # --- remark42 (ADR-0006): авторизация Telegram + Яндекс + Google ---
        # Апстрим через переменную: nginx стартует и без поднятого remark42
        # (резолв в момент запроса), а не падает на старте конфига.
        # ВАЖНО: set обязан стоять ДО rewrite ... break — break останавливает
        # обработку всех последующих директив модуля rewrite, включая set,
        # и переменная остаётся пустой ("invalid URL prefix in """).
        location /remark42/ {
            limit_req zone=remark_api burst=20 nodelay;
            set $remark_target http://remark42:8080;
            rewrite ^/remark42/(.*)$ /$1 break;
            proxy_pass $remark_target;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            client_max_body_size 64k;
        }

        # --- Слот под ИИ-сервис (ADR-0007): раскомментировать при включении ---
        #location /api/ai/ {
        #    limit_req zone=ai_api burst=3 nodelay;
        #    proxy_pass http://ai:8000/;
        #    proxy_set_header Host $host;
        #    proxy_set_header X-Real-IP $remote_addr;
        #    proxy_read_timeout 60s;
        #    client_max_body_size 16k;
        #}

        # --- Кэш собранных ассетов: иммутабельные чанки и индекс поиска ---
        location /_astro/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location /pagefind/ {
            add_header Cache-Control "public, max-age=86400";
        }

        location / {
            add_header Cache-Control "public, max-age=300";
            try_files $uri $uri/index.html =404;
        }

        # Честный 404 нашей страницей
        error_page 404 /404/index.html;
        location = /404/index.html {
            internal;
        }
    }
}
