# Развёртывание нового firebirdsql.su (ADR-0002/0006/0007).
#
# Два способа задания переменных remark42 — без обязательного .env:
#   1. Portainer: вставить этот файл как Stack и задать переменные
#      в разделе Environment (файлы .env на сервере запрещены политикой).
#   2. Локально: положить deploy/.env рядом — compose подхватит его для
#      подстановок ${...} автоматически (см. .env.example).
#
# Образ сайта собирает CI (GitHub Actions -> ghcr.io/attid/firebirdsql-site);
# Portainer просто тянет его. Локальная сборка из исходника:
#   docker build -f deploy/Dockerfile -t firebirdsql-site .

services:
  site:
    image: ghcr.io/attid/firebirdsql-site:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"   # наружу только через существующий реверс-прокси хоста
    depends_on:
      - remark42

  remark42:
    image: umputun/remark42:latest
    restart: unless-stopped
    environment:
      # Имена переменных сверены с https://remark42.com/docs/configuration/parameters/
      # ВНИМАНИЕ: префикс REMARK_ непоследователен (REMARK_URL есть,
      # REMARK_SITE не существует); провайдеры Яндекс/Google включаются
      # фактом наличия CID/CSEC, отдельных флагов нет.
      # --- обязательные ---
      - REMARK_URL=${REMARK_URL:-https://firebirdsql.su/remark42}
      - SECRET=${SECRET:?задайте SECRET, например openssl rand -hex 32}
      - SITE=firebirdsql
      # --- авторизация (ADR-0006): Telegram + Яндекс + Google ---
      - AUTH_TELEGRAM=${AUTH_TELEGRAM:-true}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN:-}
      - AUTH_YANDEX_CID=${AUTH_YANDEX_CID:-}
      - AUTH_YANDEX_CSEC=${AUTH_YANDEX_CSEC:-}
      - AUTH_GOOGLE_CID=${AUTH_GOOGLE_CID:-}
      - AUTH_GOOGLE_CSEC=${AUTH_GOOGLE_CSEC:-}
      # --- прочее ---
      - REMARK_PORT=8080
      - ADMIN_SHARED_ID=${ADMIN_SHARED_ID:-}
      - TIME_ZONE=${TIME_ZONE:-Europe/Moscow}
      - EMOJI=true
      - DEBUG=false
      # --- уведомления админу (по умолчанию выключены у remark42!) ---
      # NOTIFY_ADMINS=telegram: каждый новый комментарий постом в канал;
      # канал должен существовать, бот — быть его админом; ID канала
      # отрицательный (-100...), берётся из getUpdates бота.
      - NOTIFY_ADMINS=${NOTIFY_ADMINS:-telegram}
      - NOTIFY_TELEGRAM_CHAN=${NOTIFY_TELEGRAM_CHAN:-}
      # NOTIFY_USERS=telegram — ответы комментаторам в личку (по желанию)
    volumes:
      - remark42-data:/srv/var
    expose:
      - "8080"

  # Слот под ИИ-сервис (ADR-0007): включается без перестройки топологии.
  # ai:
  #   image: ghcr.io/attid/firebirdsql-ai:latest
  #   restart: unless-stopped
  #   environment:
  #     - AI_API_KEY=${AI_API_KEY:-}
  #   expose:
  #     - "8000"

volumes:
  remark42-data:
